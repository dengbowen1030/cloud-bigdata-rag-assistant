services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/data/edurag.db
      UPLOAD_DIR: /app/uploads/raw
      UPLOAD_PROCESSED_DIR: /app/uploads/processed
      PROCESSED_DIR: /app/uploads/processed
      VECTOR_STORE_DIR: /app/vector_store/faiss_index
      RAG_EMBEDDING_MODE: real
      RAG_EMBEDDING_MODEL_PATH: /app/models/bge-small-zh-v1.5
      RAG_EMBEDDING_DOWNLOAD: "0"
      LLM_PROVIDER: deepseek
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./vector_store:/app/vector_store
      - ./models:/app/models:ro
    expose:
      - "8000"

  frontend-build:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_USE_MOCK: "false"
        VITE_API_BASE_URL: /api
    command: sh -c "rm -rf /frontend-dist/* && cp -r /dist/. /frontend-dist/"
    volumes:
      - frontend_dist:/frontend-dist

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_started
      frontend-build:
        condition: service_completed_successfully

volumes:
  frontend_dist:
